[package]
name = "atlas-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
atlas-engine = { path = "../atlas-engine" }
atlas-protocol = { path = "../atlas-protocol" }
bytemuck = { version = "1.23", features = ["derive"] }
fontdue = { version = "0.9.3", default-features = false, features = ["hashbrown"] }
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.99", features = ["HtmlCanvasElement", "Performance", "Window"] }
wgpu = { version = "25.0.2", default-features = false, features = ["webgpu", "webgl", "wgsl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "25.0.2", default-features = false, features = ["metal", "gles", "wgsl"] }

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
